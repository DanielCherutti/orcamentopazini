# Notificações Discord (webhook gratuito).
#
# Configuração:
#   1. Discord → canal do time → Editar canal → Integrações → Webhooks → New Webhook
#   2. Copie a URL do webhook
#   3. GitHub → Settings → Secrets and variables → Actions → DISCORD_WEBHOOK_URL
#
# Dispara quando CI (PR) ou Deploy develop terminam.

name: Notify Discord

on:
  workflow_run:
    workflows:
      - CI
      - Deploy develop
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  notify:
    name: Discord
    runs-on: ubuntu-latest
    steps:
      - name: Enviar para Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL não configurado — notificação ignorada."
            exit 0
          fi

          if [ "$CONCLUSION" = "success" ]; then
            EMOJI="✅"
            COLOR=3066993
          else
            EMOJI="❌"
            COLOR=15158332
          fi

          SHORT_SHA="${COMMIT:0:7}"

          jq -n \
            --arg username "Pazini GitHub" \
            --arg content "${EMOJI} **${WORKFLOW}** — \`${CONCLUSION}\`" \
            --argjson color "$COLOR" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg url "$URL" \
            --arg sha "$SHORT_SHA" \
            '{
              username: $username,
              content: $content,
              embeds: [{
                color: $color,
                fields: [
                  {name: "Branch", value: $branch, inline: true},
                  {name: "Autor", value: $actor, inline: true},
                  {name: "Commit", value: $sha, inline: true}
                ],
                url: $url
              }]
            }' | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
